name: GitLab-CI

on:
  workflow_call:
    secrets:
      GITLAB_WRITE_API:
        required: true

jobs:
  trigger_pipeline:
    runs-on: ubuntu-24.04
    environment: mirror
    permissions:
      contents: read
      statuses: write
    steps:
      - name: "process pull request event (fetch changes)"
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@main
        with:
          fetch-depth: 100
      - name: "process pull request event (push changes)"
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git push -f https://github:${{ secrets.GITLAB_WRITE_API }}@gitlab.icp.uni-stuttgart.de/jgrad/espresso.git HEAD:PR-${{ github.event.number }}
      - name: "process push event (fetch changes)"
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@main
        with:
          fetch-depth: 100
      - name: "process push event (push changes)"
        if: ${{ github.event_name == 'push' }}
        run: |
          git push -f https://github:${{ secrets.GITLAB_WRITE_API }}@gitlab.icp.uni-stuttgart.de/jgrad/espresso.git ${{ github.ref_name }}
      - name: "update commit status"
        shell: sh
        run: |
          gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/statuses/${{ github.sha }} \
              -f 'state=pending' \
              -f 'target_url=https://gitlab.icp.uni-stuttgart.de/jgrad/espresso/commit/${{ github.sha }}/pipelines' \
              -f 'description=The build started!' \
              -f 'context=ICP GitLab CI'
