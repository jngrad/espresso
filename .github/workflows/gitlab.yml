name: GitLab CI

on:
  workflow_call:
    secrets:
      GITLAB_WRITE_API:
        required: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    environment: mirror
    permissions:
      contents: read
      statuses: write
    steps:
      - name: "process pull request event (fetch changes)"
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@main
        with:
          fetch-depth: 500
      - name: "process pull request event (push changes)"
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git push -f https://token:${{ secrets.GITLAB_WRITE_API }}@gitlab.icp.uni-stuttgart.de/jgrad/espresso.git HEAD:PR-${{ github.event.number }}
      - name: "process push event (fetch changes)"
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@main
        with:
          fetch-depth: 500
      - name: "process push event (push changes)"
        if: ${{ github.event_name == 'push' }}
        run: |
          git push -f https://token:${{ secrets.GITLAB_WRITE_API }}@gitlab.icp.uni-stuttgart.de/jgrad/espresso.git ${{ github.ref_name }}
      - name: "update commit status"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh maintainer/CI/build_cmake.sh pending
