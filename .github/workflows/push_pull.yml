  macos-14:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Python environment
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'
      - name: Get runner specifications
        run: system_profiler SPHardwareDataType
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 4
          check_procs: 4
          with_ccache: 'false'
          make_check_python: 'true'

  macos-15:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Python environment
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'
      - name: Get runner specifications
        run: system_profiler SPHardwareDataType
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 3
          check_procs: 3
          with_ccache: 'false'
          make_check_python: 'true'

  ubuntu:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/espressomd/docker/ubuntu-wo-dependencies:f7f8ef2c0ca93c67aa16b9f91785492fb04ecc1b-base-layer
      credentials:
         username: ${{ github.actor }}
         password: ${{ secrets.github_token }}
      options: --cpus 4
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu
          save: false
      - name: Setup Git environment
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get runner specifications
        run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 4
          check_procs: 4
          myconfig: 'maxset'
          with_ccache: 'true'
          with_cuda: 'false'
          with_hdf5: 'false'
          with_fftw: 'false'
          with_gsl: 'false'
          with_scafacos: 'false'
          with_stokesian_dynamics: 'false'
          make_check_unit_tests: 'true'
          make_check_python: 'false'
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
