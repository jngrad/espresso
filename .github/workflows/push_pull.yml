name: ESPResSo tests
on:
  pull_request:
  push:
    branches:
jobs:
  testsuite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup EESSI
        uses: ./.github/actions/eessi
        with:
          eessi_stack_version: 2025.06
      - name: Remote login (for live debugging)
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
      - name: Install dependencies
        run: |
          test "${RUNNER_ARCH}" = "X64" && module use /cvmfs/dev.eessi.io/espresso/versions/${EESSI_VERSION}/software/linux/x86_64/amd/zen2/modules/all
          module load ESPResSo/95f275aa2060714e5d5b6c36e39fd4a9b422eacf-foss-2025a
          module save espresso
